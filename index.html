<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GP de Monza</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game-card">
    
        <!-- Image optionnelle d'illustration -->
        <img src="assets/backgrounds/bandeau-qualifications.svg" alt="Qualifications Monza" class="card-image" sizes="auto">

        <div class="card-header">
            <h1 class="title">Acceuil</h1>
            <span class="tag">GP Monza</span>
        </div>

        <div class="card-body">
            <p>
                Glissez-vous dans le baquet d'une monoplace de Formule 1 et affrontez le légendaire Temple de la Vitesse de Monza : chaque décision prise en piste tracera votre route vers la gloire ou vers le bac à gravier.
            </p>
        </div>

        <div class="card-choices">
            <a href="pages/q1.html" class="btn-choice danger">Aller au qualifications</a>
        </div>
    </main>

</body>
</html>
